<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c7d74">
<title>ぼちゃんねる 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c7d74'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E7%AE%A1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --miku:#39c5bb;--miku-dark:#1ba398;--miku-deep:#0c7d74;--luka:#ff7fb0;
  --danger:#e0453a;--danger-d:#c4341f;--warn:#e08a1a;
  --page:#eef3f3;--panel:#fff;--panel2:#f5f9f9;--line:#dde6e6;--line2:#eaf0f0;
  --ink:#1d2728;--soft:#5c696c;--faint:#92a0a2;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --round:"M PLUS Rounded 1c",var(--jp);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--jp);background:var(--page);color:var(--ink);font-size:14px;line-height:1.55;}
a{color:var(--miku-dark);text-decoration:none;}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px;}
/* header */
.ahdr{background:linear-gradient(110deg,var(--miku-deep),var(--miku-dark));color:#fff;padding:14px 0;box-shadow:0 2px 10px rgba(12,125,116,.25);position:sticky;top:0;z-index:20;}
.ahdr .wrap{display:flex;align-items:center;gap:12px;padding-top:0;padding-bottom:0;}
.ahdr__mark{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--miku-deep);display:flex;align-items:center;justify-content:center;font-family:var(--round);font-weight:800;font-size:18px;}
.ahdr__t{font-family:var(--round);font-weight:800;font-size:19px;}
.ahdr__t small{display:block;font-size:11px;opacity:.8;font-weight:500;letter-spacing:.5px;}
.ahdr__sp{flex:1;}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.18);}
.pill.live{background:#1f8a4c;}
.pill.demo{background:var(--warn);}
.tbtn{background:rgba(255,255,255,.16);border:none;color:#fff;font-family:inherit;font-weight:700;font-size:12px;padding:7px 13px;border-radius:8px;cursor:pointer;}
.tbtn:active{opacity:.7;}

/* login */
.login{max-width:440px;margin:60px auto;background:#fff;border-radius:16px;padding:26px 24px;box-shadow:0 8px 40px rgba(12,80,76,.12);}
.login h2{font-family:var(--round);margin:0 0 4px;color:var(--miku-deep);}
.login p{margin:0 0 18px;color:var(--soft);font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:5px;}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;background:var(--panel2);outline:none;}
.field input:focus{border-color:var(--miku);background:#fff;}
.field .hint{font-size:11px;color:var(--faint);margin-top:4px;}
.btn{border:none;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer;font-size:14px;padding:12px 18px;}
.btn.primary{background:linear-gradient(180deg,var(--miku),var(--miku-dark));color:#fff;width:100%;box-shadow:0 4px 12px rgba(27,163,152,.35);}
.btn.sm{padding:6px 12px;font-size:12px;font-weight:700;}
.btn.ghost{background:var(--panel2);color:var(--soft);border:1px solid var(--line);}
.btn.danger{background:#fdecea;color:var(--danger-d);border:1px solid #f6cfca;}
.btn.warn{background:#fdf3e3;color:#b5700f;border:1px solid #f3ddb4;}
.btn:active{transform:translateY(1px);}
.err{color:var(--danger);font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px;}

/* dashboard */
.section-t{font-family:var(--round);font-weight:800;font-size:15px;color:var(--miku-deep);margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px;}
.stat{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--line);}
.stat .n{font-family:var(--round);font-weight:800;font-size:26px;color:var(--miku-deep);line-height:1;}
.stat .l{font-size:11.5px;color:var(--soft);margin-top:6px;font-weight:600;}
.stat.pink .n{color:var(--luka);}
.stat.orange .n{color:var(--warn);}

/* thread table */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.trow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);}
.trow:last-child{border-bottom:none;}
.trow__main{flex:1;min-width:0;cursor:pointer;}
.trow__title{font-weight:700;color:#17353d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trow__meta{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:12px;}
.trow__actions{display:flex;gap:8px;flex:0 0 auto;}
.chev{color:var(--faint);transition:transform .2s;flex:0 0 auto;}
.trow.open .chev{transform:rotate(90deg);}

/* posts panel */
.posts{background:var(--panel2);border-bottom:1px solid var(--line2);padding:6px 0;display:none;}
.posts.open{display:block;}
.prow{display:flex;gap:10px;padding:10px 16px 10px 30px;border-bottom:1px dashed var(--line);}
.prow:last-child{border-bottom:none;}
.prow.abone{opacity:.55;}
.prow__n{font-weight:800;color:var(--miku-dark);font-size:12.5px;flex:0 0 auto;width:30px;}
.prow__c{flex:1;min-width:0;}
.prow__head{font-size:11px;color:var(--faint);margin-bottom:3px;}
.prow__head b{color:var(--name-grn,#1f8a4c);}
.prow__body{font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:#242d2f;}
.prow.abone .prow__body{font-style:italic;color:var(--faint);}
.prow__act{display:flex;gap:6px;flex:0 0 auto;align-items:flex-start;}
.ibtn{border:none;background:none;cursor:pointer;font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:6px;}
.ibtn.warn{color:#b5700f;background:#fdf3e3;}
.ibtn.danger{color:var(--danger-d);background:#fdecea;}
.empty{padding:40px;text-align:center;color:var(--faint);}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#143a45;color:#fff;padding:11px 20px;border-radius:24px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#a5302a;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0;}
.searchbox{flex:1;min-width:180px;}
.searchbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-family:inherit;font-size:14px;outline:none;background:#fff;}
.searchbox input:focus{border-color:var(--miku);}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr);} .ahdr__t small{display:none;}}
</style>
</head>
<body>
  <header class="ahdr">
    <div class="wrap">
      <div class="ahdr__mark">管</div>
      <div class="ahdr__t">ぼちゃんねる<small>MODERATION CONSOLE</small></div>
      <div class="ahdr__sp"></div>
      <span class="pill" id="modePill" style="display:none"></span>
      <button class="tbtn" id="logout" style="display:none">ログアウト</button>
      <a class="tbtn" href="index.html" style="display:none" id="toBoard">掲示板へ</a>
    </div>
  </header>

  <div class="wrap" id="app"></div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $=(s,r=document)=>r.querySelector(s);
  const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const LS_KEY="bochannel_demo_v1";        // shared demo store with the board
  const CFG_KEY="bochannel_admin_cfg";

  let cfg = load(CFG_KEY) || { base:"", key:"" };
  const isDemo = ()=> !cfg.base;

  function load(k){ try{return JSON.parse(localStorage.getItem(k));}catch(_){return null;} }
  function saveCfg(){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

  // ---------- demo store helpers (mirror api.js shape) ----------
  function db(){ const d=load(LS_KEY); return d&&d.threads?d:{threads:[],lastPostAt:0}; }
  function dbSave(d){ localStorage.setItem(LS_KEY, JSON.stringify(d)); }

  // ---------- remote ----------
  async function call(path, opts={}){
    const res = await fetch(cfg.base+path, {
      ...opts,
      headers:{ "Content-Type":"application/json", "x-admin-key": cfg.key, ...(opts.headers||{}) }
    });
    let data=null; try{data=await res.json();}catch(_){}
    if(!res.ok){ const e=new Error((data&&data.error)||("エラー "+res.status)); e.status=res.status; throw e; }
    return data;
  }

  // ---------- data API (demo or remote) ----------
  const data = {
    async overview(){
      if(isDemo()){
        const d=db();
        const posts=d.threads.reduce((a,t)=>a+t.posts.length,0);
        const today=Date.now()-86400000;
        const todayPosts=d.threads.reduce((a,t)=>a+t.posts.filter(p=>p.ts>today).length,0);
        return { threads:d.threads.map(t=>({id:t.id,title:t.title,postCount:t.posts.length,createdAt:t.createdAt,lastAt:t.lastAt,abone:!!t.abone})),
          stats:{threads:d.threads.length,posts,todayPosts,abones:d.threads.reduce((a,t)=>a+t.posts.filter(p=>p.abone).length,0)} };
      }
      return call("/api/admin/overview");
    },
    async posts(id){
      if(isDemo()){ const t=db().threads.find(x=>x.id===id); return t?t.posts:[]; }
      return (await call("/api/admin/thread?id="+encodeURIComponent(id))).posts;
    },
    async abone(id,num,on){
      if(isDemo()){ const d=db(); const t=d.threads.find(x=>x.id===id); const p=t.posts.find(x=>x.num===num); if(p)p.abone=on; dbSave(d); return; }
      return call("/api/admin/abone",{method:"POST",body:JSON.stringify({threadId:id,num,abone:on})});
    },
    async delPost(id,num){
      if(isDemo()){ const d=db(); const t=d.threads.find(x=>x.id===id); t.posts=t.posts.filter(x=>x.num!==num); t.postCount=t.posts.length; dbSave(d); return; }
      return call("/api/admin/delete-post",{method:"POST",body:JSON.stringify({threadId:id,num})});
    },
    async delThread(id){
      if(isDemo()){ const d=db(); d.threads=d.threads.filter(x=>x.id!==id); dbSave(d); return; }
      return call("/api/admin/delete-thread",{method:"POST",body:JSON.stringify({id})});
    },
    async aboneThread(id,on){
      if(isDemo()){ const d=db(); const t=d.threads.find(x=>x.id===id); if(t)t.abone=on; dbSave(d); return; }
      return call("/api/admin/abone-thread",{method:"POST",body:JSON.stringify({id,abone:on})});
    }
  };

  // ---------- toast ----------
  let tt; function toast(m,err){ const t=$("#toast"); t.textContent=m; t.classList.toggle("err",!!err); t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }

  // ---------- views ----------
  const app=$("#app");
  let authed=false, list=[];

  function loginView(){
    authed=false;
    $("#modePill").style.display="none"; $("#logout").style.display="none"; $("#toBoard").style.display="none";
    app.innerHTML=`
      <div class="login">
        <h2>🔐 管理者ログイン</h2>
        <p>Cloudflare Worker のURLと管理キーを入力してください。空欄のままなら<b>デモモード</b>（このブラウザ内のデータ）で動作します。</p>
        <div class="field">
          <label>Worker URL <span style="font-weight:500;color:#92a0a2">（任意）</span></label>
          <input id="iBase" placeholder="https://bochannel-api.xxx.workers.dev" value="${esc(cfg.base)}">
          <div class="hint">空欄＝デモモード。デプロイ後にWorkerのURLを入力。</div>
        </div>
        <div class="field">
          <label>管理キー（ADMIN_KEY）</label>
          <input id="iKey" type="password" placeholder="Workerに設定したシークレット" value="${esc(cfg.key)}">
          <div class="hint">デモモードでは任意の値でOK。</div>
        </div>
        <button class="btn primary" id="doLogin">ログイン</button>
        <div class="err" id="loginErr"></div>
      </div>`;
    $("#doLogin").onclick=async()=>{
      cfg.base=$("#iBase").value.trim().replace(/\/+$/,""); cfg.key=$("#iKey").value.trim();
      $("#loginErr").textContent="";
      try{ await data.overview(); saveCfg(); authed=true; dashboard(); toast("ログインしました"); }
      catch(e){ $("#loginErr").textContent = e.status===401?"管理キーが正しくありません":(e.message||"接続に失敗しました"); }
    };
    $("#iKey").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#doLogin").click(); });
  }

  async function dashboard(){
    $("#logout").style.display="inline-block"; $("#toBoard").style.display="inline-block";
    const pill=$("#modePill"); pill.style.display="inline-block";
    pill.className="pill "+(isDemo()?"demo":"live"); pill.textContent=isDemo()?"DEMO":"LIVE";
    app.innerHTML=`<div class="empty">読み込み中…</div>`;
    let ov;
    try{ ov=await data.overview(); }catch(e){ toast(e.message,true); loginView(); return; }
    list=ov.threads.slice().sort((a,b)=>b.lastAt-a.lastAt);
    const s=ov.stats;
    app.innerHTML=`
      <div class="stats">
        <div class="stat"><div class="n">${s.threads}</div><div class="l">スレッド数</div></div>
        <div class="stat pink"><div class="n">${s.posts}</div><div class="l">総書き込み数</div></div>
        <div class="stat orange"><div class="n">${s.todayPosts}</div><div class="l">24時間の書き込み</div></div>
        <div class="stat"><div class="n">${s.abones||0}</div><div class="l">あぼ〜ん済</div></div>
      </div>
      <div class="section-t">🧵 スレッド管理</div>
      <div class="toolbar">
        <div class="searchbox"><input id="q" placeholder="スレッドタイトルを検索…"></div>
        <button class="btn ghost sm" id="reload">↻ 再読込</button>
        ${isDemo()?'<button class="btn warn sm" id="resetDemo">デモデータ初期化</button>':''}
      </div>
      <div id="tlist" style="margin-top:12px;"></div>`;
    renderList();
    $("#q").addEventListener("input",renderList);
    $("#reload").onclick=dashboard;
    if(isDemo()) $("#resetDemo").onclick=()=>{ if(confirm("デモデータを初期状態に戻しますか？")){ localStorage.removeItem(LS_KEY); toast("初期化しました"); dashboard(); } };
  }

  function renderList(){
    const q=($("#q")?.value||"").toLowerCase();
    const rows=list.filter(t=>t.title.toLowerCase().includes(q));
    const host=$("#tlist");
    if(!rows.length){ host.innerHTML=`<div class="card"><div class="empty">スレッドがありません</div></div>`; return; }
    host.innerHTML=`<div class="card">`+rows.map(t=>{
      const d=new Date(t.createdAt);
      return `<div class="trow${t.abone?' abone':''}" data-id="${esc(t.id)}">
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        <div class="trow__main">
          <div class="trow__title">${t.abone?'🚫 ':''}${esc(t.title)}</div>
          <div class="trow__meta"><span>${t.postCount} レス</span><span>${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}</span><span>ID: ${esc(t.id)}</span></div>
        </div>
        <div class="trow__actions">
          <button class="btn warn sm" data-act="aboneT">${t.abone?'復活':'非表示'}</button>
          <button class="btn danger sm" data-act="delT">スレ削除</button>
        </div>
      </div>
      <div class="posts" data-posts="${esc(t.id)}"></div>`;
    }).join("")+`</div>`;

    host.querySelectorAll(".trow").forEach(row=>{
      const id=row.dataset.id;
      row.querySelector(".trow__main").onclick=()=>togglePosts(id,row);
      row.querySelector('[data-act="delT"]').onclick=async(e)=>{ e.stopPropagation();
        if(!confirm("このスレッドを完全に削除しますか？（元に戻せません）"))return;
        await data.delThread(id); toast("スレッドを削除しました"); dashboard(); };
      row.querySelector('[data-act="aboneT"]').onclick=async(e)=>{ e.stopPropagation();
        const t=list.find(x=>x.id===id); await data.aboneThread(id,!t.abone); toast(t.abone?"表示に戻しました":"非表示にしました"); dashboard(); };
    });
  }

  function togglePosts(id,row){
    const panel=row.parentElement.querySelector(`[data-posts="${CSS.escape(id)}"]`);
    const open=panel.classList.contains("open");
    document.querySelectorAll(".posts.open").forEach(p=>p.classList.remove("open"));
    document.querySelectorAll(".trow.open").forEach(r=>r.classList.remove("open"));
    if(open) return;
    row.classList.add("open"); panel.classList.add("open");
    renderPosts(id,row);
  }
  async function renderPosts(id,row){
    const panel=row.parentElement.querySelector(`[data-posts="${CSS.escape(id)}"]`);
    panel.innerHTML=`<div class="empty">読み込み中…</div>`;
    let posts; try{ posts=await data.posts(id); }catch(e){ panel.innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
    panel.innerHTML=posts.map(p=>`
      <div class="prow${p.abone?' abone':''}" data-num="${p.num}">
        <div class="prow__n">${p.num}</div>
        <div class="prow__c">
          <div class="prow__head"><b>${esc(p.name||'名無しのボカロP')}</b> ${esc(p.date||'')} ID:${esc(p.uid||'')} ${p.email?'<i>['+esc(p.email)+']</i>':''}</div>
          <div class="prow__body">${p.abone?'（あぼ〜ん済み）':esc(p.body)}</div>
        </div>
        <div class="prow__act">
          <button class="ibtn warn" data-act="abone">${p.abone?'復活':'あぼ〜ん'}</button>
          <button class="ibtn danger" data-act="del">削除</button>
        </div>
      </div>`).join("")||`<div class="empty">書き込みがありません</div>`;
    panel.querySelectorAll(".prow").forEach(pr=>{
      const num=Number(pr.dataset.num);
      const p=posts.find(x=>x.num===num);
      pr.querySelector('[data-act="abone"]').onclick=async()=>{ await data.abone(id,num,!p.abone); toast(p.abone?"復活しました":"あぼ〜んしました"); renderPosts(id,row); };
      pr.querySelector('[data-act="del"]').onclick=async()=>{ if(!confirm("この書き込みを削除しますか？"))return; await data.delPost(id,num); toast("削除しました"); renderPosts(id,row); };
    });
  }

  $("#logout").onclick=()=>{ cfg={base:"",key:""}; localStorage.removeItem(CFG_KEY); loginView(); };

  // boot
  loginView();
})();
</script>
</body>
</html>
