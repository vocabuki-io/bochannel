<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#39c5bb">
<title>ぼちゃんねる｜ボカロ専門掲示板</title>
<meta name="description" content="ぼちゃんねる — 初音ミクをはじめとするボーカロイドを語る専門掲示板。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2339c5bb'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E3%81%BC%3C/text%3E%3C/svg%3E">
<style>
/* ===========================================================
   ぼちゃんねる — Vocaloid BBS
   Mobile-first textboard reader styling
   =========================================================== */

:root{
  --miku:      #39c5bb;       /* 初音ミク teal */
  --miku-dark: #1ba398;
  --miku-deep: #0c7d74;
  --luka:      #ff7fb0;       /* pink accent */
  --rin:       #ffae3a;       /* orange accent */
  --name-grn:  #1f8a4c;       /* classic 名無し green */
  --anchor:    #0f6fc4;       /* >> anchor / link blue */
  --thread-red:#c4341f;       /* thread title classic red */
  --page-bg:   #e6edee;
  --panel:     #ffffff;
  --panel-2:   #f4f8f8;
  --line:      #d7e0e1;
  --line-2:    #e7eded;
  --ink:       #20292b;
  --ink-soft:  #5c696c;
  --ink-faint: #93a1a3;
  --sage:      #8a9396;
  --maxw:      680px;
  --hdr-h:     48px;
  --tab-h:     42px;
  --shadow:    0 1px 0 rgba(0,0,0,.04);
  --jp: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",YuGothic,"Meiryo",sans-serif;
  --round: "M PLUS Rounded 1c",var(--jp);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: rgba(57,197,187,.18); }
html,body{ margin:0; padding:0; }
body{
  font-family: var(--jp);
  background: var(--page-bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  overflow-y: scroll;
}
a{ color: var(--anchor); text-decoration:none; }
a:active{ opacity:.6; }
img{ max-width:100%; }

/* ---- App shell: centered mobile column on desktop ---- */
.app{
  max-width: var(--maxw);
  margin: 0 auto;
  background: var(--panel);
  min-height: 100vh;
  box-shadow: 0 0 0 1px var(--line), 0 8px 40px rgba(10,60,58,.10);
  position: relative;
}

/* =========================== Header =========================== */
.hdr{
  position: sticky; top:0; z-index: 40;
  height: var(--hdr-h);
  display:flex; align-items:center; gap:10px;
  padding: 0 12px;
  color:#fff;
  background:
     linear-gradient(180deg, var(--miku) 0%, var(--miku-dark) 100%);
  box-shadow: 0 2px 6px rgba(12,125,116,.28);
}
.hdr__back{
  width:30px; height:30px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  border-radius:8px; color:#fff; font-size:20px; line-height:1;
  background: rgba(255,255,255,.16);
  border: none; cursor:pointer; padding:0;
  opacity:0; pointer-events:none; transform: translateX(-4px);
  transition: opacity .15s, transform .15s;
}
.hdr__back.show{ opacity:1; pointer-events:auto; transform:none; }
.brand{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  min-width:0;
}
.brand__mark{
  width:28px; height:28px; flex:0 0 auto; border-radius:8px;
  background:#fff; color:var(--miku-dark);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--round); font-weight:800; font-size:18px;
  box-shadow: inset 0 0 0 2px rgba(12,125,116,.15);
}
.brand__name{
  font-family: var(--round); font-weight:800; letter-spacing:.5px;
  font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  text-shadow: 0 1px 0 rgba(0,0,0,.12);
}
.brand__title{ /* shown in thread view */
  font-size:14px; font-weight:700; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  min-width:0;
}
.hdr__spacer{ flex:1 1 auto; }
.hdr__btn{
  width:32px; height:32px; flex:0 0 auto; border:none; cursor:pointer;
  background: rgba(255,255,255,.16); color:#fff; border-radius:8px;
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.hdr__btn svg{ width:18px; height:18px; }

/* =========================== Board banner =========================== */
.banner{
  background: linear-gradient(120deg,#eafbf9,#f3fbf7);
  border-bottom:1px solid var(--line);
  padding: 12px 14px;
  display:flex; align-items:center; gap:12px;
}
.banner__icon{
  width:46px;height:46px;flex:0 0 auto;border-radius:12px;
  background: radial-gradient(120% 120% at 30% 20%, #5fe0d6, var(--miku) 55%, var(--miku-dark));
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-size:24px;
  box-shadow: 0 4px 12px rgba(57,197,187,.4);
}
.banner__txt{ min-width:0; }
.banner__name{ font-family:var(--round); font-weight:800; font-size:18px; color:var(--miku-deep); }
.banner__desc{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
.banner__stats{ font-size:11px; color:var(--ink-faint); margin-top:3px; display:flex; gap:10px; }

/* =========================== Tabs =========================== */
.tabs{
  position: sticky; top: var(--hdr-h); z-index: 30;
  display:flex; height: var(--tab-h);
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.tab{
  flex:1; border:none; background:none; cursor:pointer;
  font-family: inherit; font-size:13px; font-weight:700; color:var(--ink-soft);
  position:relative; display:flex;align-items:center;justify-content:center; gap:5px;
}
.tab[aria-selected="true"]{ color: var(--miku-deep); }
.tab[aria-selected="true"]::after{
  content:""; position:absolute; left:14%; right:14%; bottom:0; height:3px;
  border-radius:3px 3px 0 0; background: var(--miku);
}
.tab .cnt{ font-size:11px; color:var(--ink-faint); font-weight:600; }

/* =========================== Thread list =========================== */
.list{ padding-bottom: 88px; }
.thread{
  display:flex; align-items:flex-start; gap:10px;
  padding: 11px 14px; border-bottom:1px solid var(--line-2);
  cursor:pointer; background:var(--panel);
  transition: background .12s;
}
.thread:active{ background: var(--panel-2); }
.thread__rank{
  flex:0 0 auto; width:22px; text-align:center;
  font-family:var(--round); font-weight:800; font-size:15px;
  color:var(--ink-faint); padding-top:1px;
}
.thread:nth-child(1) .thread__rank{ color:var(--rin); }
.thread:nth-child(2) .thread__rank{ color:#9fb6b9; }
.thread:nth-child(3) .thread__rank{ color:#caa06a; }
.thread__body{ min-width:0; flex:1; }
.thread__title{
  font-size:15px; font-weight:600; color:#173b46; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.thread:active .thread__title{ color:var(--miku-deep); }
.thread__meta{
  margin-top:5px; display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  font-size:11.5px; color:var(--ink-faint);
}
.thread__count{
  display:inline-flex; align-items:center; gap:3px;
  font-weight:700; color:var(--miku-dark);
}
.momentum{
  display:inline-flex; align-items:center; gap:4px;
  padding:1px 7px; border-radius:20px; font-weight:700; font-size:10.5px;
  background: #eef6f5; color:var(--miku-deep);
}
.momentum.hot{ background: #ffe9d6; color:#c8631a; }
.momentum.fire{ background:#ffe1e1; color:#cf3b2f; }
.thread__new{
  font-size:10px; font-weight:800; color:#fff; background:var(--luka);
  padding:1px 5px; border-radius:4px; letter-spacing:.4px;
}

/* =========================== Thread view (posts) =========================== */
.threadhead{
  padding:14px 16px 12px; border-bottom:1px solid var(--line);
  background: linear-gradient(180deg,#f4fbfa,#ffffff);
}
.threadhead__title{
  font-size:18px; font-weight:800; color:#143a45; line-height:1.4;
  font-family:var(--round);
}
.threadhead__meta{ margin-top:6px; font-size:11.5px; color:var(--ink-faint); display:flex; gap:12px; flex-wrap:wrap; }

.posts{ padding-bottom: 96px; }
.post{
  padding: 12px 16px 13px; border-bottom: 1px solid var(--line-2);
  scroll-margin-top: calc(var(--hdr-h) + 6px);
}
.post.flash{ animation: flash 1.4s ease; }
@keyframes flash{ 0%{ background:#fff7d6; } 100%{ background:transparent; } }
.post__head{
  display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
  font-size:12px; margin-bottom:5px; line-height:1.5;
}
.post__num{
  font-weight:800; color:var(--miku-dark); font-size:12.5px;
  cursor:pointer;
}
.post__num.op{ color:var(--luka); }
.post__name{ color:var(--name-grn); font-weight:700; }
.post__name .trip{ color:#6b7a7d; font-weight:600; }
.post__date{ color:var(--ink-faint); }
.post__id{ color:var(--ink-faint); cursor:pointer; }
.post__id.many{ color:var(--rin); font-weight:700; }
.post__sage{ color:var(--sage); font-size:10.5px; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
.post__body{
  font-size:15px; line-height:1.72; white-space:pre-wrap; word-break:break-word;
  margin-left:2px; color:#222b2d;
}
.post__body .anchor{ color:var(--anchor); cursor:pointer; border-bottom:1px dotted var(--anchor); }
.post__body .url{ color:var(--anchor); text-decoration:underline; word-break:break-all; }
.post__body .gt{ color:#1f8a4c; }   /* >quote green */
.post.abone .post__body{ color:var(--ink-faint); font-style:italic; }

.post__foot{ margin-top:7px; display:flex; gap:14px; }
.post__reply{
  font-size:11.5px; color:var(--miku-dark); font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; gap:4px;
}

/* anchor preview popover */
.popover{
  position:fixed; z-index:60; max-width: 360px;
  background:#fffef6; border:1px solid #d8cf9b;
  box-shadow: 0 8px 28px rgba(0,0,0,.22); border-radius:8px;
  padding:9px 11px; font-size:13px; line-height:1.6;
}
.popover .post__head{ font-size:11px; margin-bottom:4px; }
.popover .post__body{ font-size:13.5px; }

/* =========================== Forms =========================== */
.composer-bar{
  position: fixed; left:0; right:0; bottom:0; z-index:45;
  display:flex; justify-content:center; pointer-events:none;
}
.composer-bar__inner{
  width:100%; max-width:var(--maxw); padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex; gap:10px; pointer-events:auto;
  background: linear-gradient(180deg, rgba(255,255,255,0), #fff 38%);
}
.fab{
  flex:1; height:46px; border:none; border-radius:24px; cursor:pointer;
  font-family:var(--jp); font-weight:800; font-size:15px; color:#fff;
  background: linear-gradient(180deg, var(--miku), var(--miku-dark));
  box-shadow: 0 6px 18px rgba(27,163,152,.45);
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.fab.alt{ background: linear-gradient(180deg,#ff95bd,var(--luka)); box-shadow:0 6px 18px rgba(255,127,176,.45); flex:0 0 auto; width:56px; }
.fab:active{ transform: translateY(1px); }

/* sheet form */
.sheet-wrap{ position:fixed; inset:0; z-index:80; display:none; }
.sheet-wrap.open{ display:block; }
.sheet-backdrop{ position:absolute; inset:0; background:rgba(10,30,32,.45); animation:fade .2s; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet{
  position:absolute; left:0; right:0; bottom:0; margin:0 auto; max-width:var(--maxw);
  background:#fff; border-radius:16px 16px 0 0; padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.2); animation: slideup .26s cubic-bezier(.2,.8,.2,1);
  max-height: 90vh; overflow:auto;
}
@keyframes slideup{ from{ transform: translateY(100%);} to{ transform:none; } }
.sheet__grip{ width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px; }
.sheet__title{ font-family:var(--round); font-weight:800; font-size:17px; color:var(--miku-deep); margin:0 0 12px; }
.field{ margin-bottom:11px; }
.field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
.field input, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  font-family:var(--jp); font-size:15px; color:var(--ink); background:var(--panel-2);
  outline:none; transition:border-color .15s, background .15s;
}
.field input:focus, .field textarea:focus{ border-color:var(--miku); background:#fff; }
.field textarea{ min-height:120px; resize:vertical; line-height:1.6; }
.field .row{ display:flex; gap:10px; }
.field .row > *{ flex:1; }
.hint{ font-size:11px; color:var(--ink-faint); margin-top:3px; }
.sheet__actions{ display:flex; gap:10px; margin-top:6px; }
.btn{
  flex:1; height:46px; border:none; border-radius:12px; cursor:pointer;
  font-family:var(--jp); font-weight:800; font-size:15px;
}
.btn.primary{ color:#fff; background:linear-gradient(180deg,var(--miku),var(--miku-dark)); box-shadow:0 4px 12px rgba(27,163,152,.4); }
.btn.ghost{ background:var(--panel-2); color:var(--ink-soft); flex:0 0 auto; width:96px; }
.btn:disabled{ opacity:.5; }
.errline{ color:#cf3b2f; font-size:12.5px; font-weight:700; margin:2px 0 8px; display:none; }
.errline.show{ display:block; }

/* =========================== misc states =========================== */
.empty{ padding:60px 24px; text-align:center; color:var(--ink-faint); }
.empty .em{ font-size:42px; margin-bottom:10px; }
.loading{ padding:40px; text-align:center; color:var(--ink-faint); }
.spinner{
  width:30px;height:30px;border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--miku);
  margin:0 auto 12px; animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg);} }
.toast{
  position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px);
  background:#143a45; color:#fff; padding:10px 18px; border-radius:24px;
  font-size:13.5px; font-weight:700; z-index:90; opacity:0; transition:opacity .25s, transform .25s;
  box-shadow:0 8px 24px rgba(0,0,0,.3); pointer-events:none; max-width:90%;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast.err{ background:#a5302a; }

/* footer credit */
.foot{
  padding:18px 16px 26px; text-align:center; color:var(--ink-faint); font-size:11px;
  border-top:1px solid var(--line-2); background:var(--panel-2);
}
.foot a{ color:var(--miku-dark); }

/* search overlay */
.search-row{ display:none; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel-2); }
.search-row.open{ display:block; }
.search-row input{
  width:100%; border:1px solid var(--line); border-radius:20px; padding:8px 14px;
  font-family:var(--jp); font-size:14px; outline:none; background:#fff;
}
.search-row input:focus{ border-color:var(--miku); }

@media (max-width: 480px){
  body{ font-size:14.5px; }
}

</style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="hdr">
      <button class="hdr__back" id="back" aria-label="戻る">‹</button>
      <div class="brand" id="brand">
        <div class="brand__mark">ぼ</div>
        <div class="brand__name">ぼちゃんねる</div>
      </div>
      <div class="brand__title" id="hdrTitle" style="display:none"></div>
      <div class="hdr__spacer"></div>
      <button class="hdr__btn" id="hdrSearch" aria-label="検索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </header>

    <!-- search -->
    <div class="search-row" id="searchRow">
      <input id="searchInput" type="search" placeholder="スレッドタイトルを検索…" autocomplete="off">
    </div>

    <!-- board banner -->
    <div class="banner" id="banner"></div>

    <!-- tabs -->
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <!-- main view -->
    <main id="view"></main>

    <!-- floating composer -->
    <div class="composer-bar">
      <div class="composer-bar__inner">
        <button class="fab" id="fabNew">🧵 新規スレッド</button>
        <button class="fab alt" id="fabThread" style="display:none" aria-label="新規スレッド">🧵</button>
      </div>
    </div>
  </div>

  <!-- composer sheet mount -->
  <div class="sheet-wrap" id="sheetWrap"></div>

  <script>
/* ===========================================================
   ぼちゃんねる — data layer
   Talks to the Cloudflare Worker when CONFIG.API_BASE is set.
   Falls back to a localStorage "demo board" so the site is
   fully usable before/without a backend (e.g. GitHub Pages
   preview). Same method surface either way.
   =========================================================== */
(function (global) {
  "use strict";

  // ---------------------------------------------------------
  // CONFIG — after deploying the Worker, paste its URL here
  // (or leave "" to keep running on the built-in demo store).
  //   e.g. "https://bochannel-api.yourname.workers.dev"
  // ---------------------------------------------------------
  const CONFIG = {
    API_BASE: "https://bochannel-api.dragxonx3.workers.dev",          // Cloudflare Worker origin, no trailing slash
    BOARD: "vocaloid",
    BOARD_NAME: "ボーカロイド総合",
  };

  const LS_KEY = "bochannel_demo_v1";
  const usingRemote = () => !!CONFIG.API_BASE;

  // ===================== remote (Worker) =====================
  async function call(path, opts) {
    const res = await fetch(CONFIG.API_BASE + path, {
      headers: { "Content-Type": "application/json" },
      ...opts,
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const msg = (data && data.error) || ("通信エラー (" + res.status + ")");
      const err = new Error(msg); err.status = res.status; err.retryAfter = data && data.retryAfter;
      throw err;
    }
    return data;
  }

  // ===================== local demo store =====================
  function nowParts(d) {
    const W = ["日","月","火","水","木","金","土"];
    const p = (n) => String(n).padStart(2, "0");
    const ms = String(d.getMilliseconds()).padStart(3,"0").slice(0,2);
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}(${W[d.getDay()]}) ` +
           `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${ms}`;
  }
  function randId() {
    const c = "ABCDEFGHIJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz0123456789+/";
    let s = ""; for (let i = 0; i < 8; i++) s += c[Math.floor(Math.random()*c.length)];
    return s;
  }
  function uid() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(LS_KEY)); } catch (_) {}
    if (!raw || !raw.threads) { raw = seed(); save(raw); }
    return raw;
  }
  function save(db) { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (_) {} }

  // seed data — clean, original Vocaloid-fan flavour
  function seed() {
    const base = Date.now();
    const mk = (offsetMin, name, body, idtag) => ({
      name: name || "名無しのボカロP",
      email: "",
      body,
      date: nowParts(new Date(base - offsetMin*60000)),
      uid: idtag || randId(),
      ts: base - offsetMin*60000,
    });
    const threads = [
      {
        id: "t_miku", title: "【初音ミク】みんなの好きなミク曲を語るスレ Part.187",
        posts: [
          mk(900,"名無しのボカロP","ミクの曲で人生変わった人集まれ\nまずは語ろうぜ","M1kuLov3"),
          mk(880,"名無しのボカロP",">>1\nわかる\n中学の時に出会ってからずっと聴いてる","Aa90xQ2z"),
          mk(861,"名無しのボカロP","初期の調教も味があって好きなんだよな","kP4r0nVe"),
          mk(840,"名無しのボカロP",">>3\n今の技術で聴き慣れると逆に新鮮に感じる","Zx8mNb1L"),
          mk(700,"名無しのボカロP","ライブ行った人いる?\n生バンドのミク最高だった","r1nL3nGm"),
          mk(540,"名無しのボカロP","sageで失礼\n最近の若い子もミク知っててうれしい","Qw3eRt5y"),
          mk(300,"名無しのボカロP",">>6\n世代を超えて愛されてるの本当にすごい","Vo1c4l0d"),
          mk(120,"名無しのボカロP","結局ミクは令和でも現役なんだよなあ","mIku39ss"),
        ],
      },
      {
        id: "t_rinlen", title: "鏡音リン・レンの双子感が好きな奴ちょっと来い",
        posts: [
          mk(620,"名無しのボカロP","ハモリの掛け合いが神すぎる","R1nL3n00"),
          mk(610,"名無しのボカロP",">>1\nツインボーカルの破壊力は異常","ab12Cd34"),

        ],
      },
      {
        id: "t_dtm", title: "【DTM】ボカロP初心者だけど作曲のコツ教えて",
        posts: [
          mk(430,"名無しのボカロP","DAW買ったはいいけど何から手をつければ…","newbie01"),
          mk(420,"名無しのボカロP",">>1\nまずは好きな曲のコピーから始めるといい","s3nP4iXx"),
          mk(410,"名無しのボカロP","コード進行は王道進行覚えるだけでだいぶ変わる","komP0z3r"),
          mk(360,"名無しのボカロP",">>3\n王道進行ほんと優秀\n困ったら使ってる","Hr4mNb8c"),
          mk(200,"名無しのボカロP","調声は譜面とにらめっこする時間が一番大事","tUn3rPro"),

        ],
      },
      {
        id: "t_luka", title: "巡音ルカの大人っぽい声質好きな人いる?",
        posts: [
          mk(220,"名無しのボカロP","ルカの低音とバイリンガルさが唯一無二","Luk4S0ng"),
          mk(180,"名無しのボカロP",">>1\nジャズ系との相性が抜群なんだよな","mZ9oPq1r"),
          mk(60,"名無しのボカロP","落ち着いた曲調が増える季節に聴きたくなる","cooLvc3l"),
        ],
      },
      {
        id: "t_gumi", title: "GUMIの曲って中毒性高くない?",
        posts: [
          mk(150,"名無しのボカロP","疾走感のある曲が刺さりまくる","Gum1Lov3"),
          mk(140,"名無しのボカロP",">>1\nロック系の伸びは随一だと思う","pl9Wsx2e"),
        ],
      },
      {
        id: "t_news", title: "【雑談】最近ハマってるボカロ曲を淡々と貼るスレ",
        posts: [
          mk(95,"名無しのボカロP","作業用に無限ループしてる曲ある?","work8gm9"),
          mk(80,"名無しのボカロP",">>1\nテンポ速めのやつ作業はかどる","aZ1sW2dx"),
          mk(30,"名無しのボカロP","深夜に聴くしっとり系も捨てがたい","n1ghtvc0"),
          mk(8,"名無しのボカロP","この時間に開いてる同志おる?","l4t3n1te"),
        ],
      },
    ];
    // attach numbers + meta
    threads.forEach(t => {
      t.posts.forEach((p, i) => p.num = i + 1);
      t.createdAt = t.posts[0].ts;
      t.lastAt = t.posts[t.posts.length - 1].ts;
      t.postCount = t.posts.length;
      t.board = CONFIG.BOARD;
    });
    return { threads, lastPostAt: 0 };
  }

  function metaOf(t) {
    return { id: t.id, title: t.title, createdAt: t.createdAt, lastAt: t.lastAt,
             postCount: t.postCount, board: t.board, abone: !!t.abone };
  }

  const localApi = {
    async getThreads() {
      const db = load();
      return db.threads.filter(t => !t.abone).map(metaOf);
    },
    async getThread(id) {
      const db = load();
      const t = db.threads.find(x => x.id === id);
      if (!t) { const e = new Error("スレッドが見つかりません"); e.status = 404; throw e; }
      return { ...metaOf(t), posts: t.posts };
    },
    async createThread({ title, name, email, body }) {
      const db = load();
      checkRate(db);
      const t = {
        id: uid(), title: (title||"").trim(), board: CONFIG.BOARD,
        posts: [], createdAt: Date.now(), lastAt: Date.now(), postCount: 0,
      };
      const post = {
        num: 1, name: (name||"").trim() || "名無しのボカロP",
        email: (email||"").trim(), body: (body||"").trim(),
        date: nowParts(new Date()), uid: randId(), ts: Date.now(),
      };
      t.posts.push(post); t.postCount = 1;
      db.threads.unshift(t); db.lastPostAt = Date.now(); save(db);
      return { id: t.id, num: 1 };
    },
    async createPost({ threadId, name, email, body }) {
      const db = load();
      checkRate(db);
      const t = db.threads.find(x => x.id === threadId);
      if (!t) { const e = new Error("スレッドが見つかりません"); e.status = 404; throw e; }
      const post = {
        num: t.posts.length + 1, name: (name||"").trim() || "名無しのボカロP",
        email: (email||"").trim(), body: (body||"").trim(),
        date: nowParts(new Date()), uid: randId(), ts: Date.now(),
      };
      t.posts.push(post); t.postCount = t.posts.length;
      const isSage = /sage/i.test(post.email);
      if (!isSage) { t.lastAt = Date.now(); db.threads = [t, ...db.threads.filter(x=>x!==t)]; }
      db.lastPostAt = Date.now(); save(db);
      return { num: post.num };
    },
  };

  function checkRate(db) {
    const last = db.lastPostAt || 0;
    const wait = 8000; // demo throttle 8s
    if (Date.now() - last < wait) {
      const e = new Error("連投規制中です。少し待ってから書き込んでください");
      e.status = 429; e.retryAfter = Math.ceil((wait - (Date.now()-last))/1000); throw e;
    }
  }

  // ===================== remote wrappers =====================
  const remoteApi = {
    getThreads: () => call(`/api/threads?board=${CONFIG.BOARD}`).then(d => d.threads),
    getThread: (id) => call(`/api/thread?id=${encodeURIComponent(id)}`),
    createThread: (p) => call(`/api/thread`, { method:"POST", body: JSON.stringify({ ...p, board: CONFIG.BOARD }) }),
    createPost: (p) => call(`/api/post`, { method:"POST", body: JSON.stringify(p) }),
  };

  global.API = {
    CONFIG,
    isDemo: () => !usingRemote(),
    getThreads: (...a) => (usingRemote() ? remoteApi : localApi).getThreads(...a),
    getThread:  (...a) => (usingRemote() ? remoteApi : localApi).getThread(...a),
    createThread:(...a)=> (usingRemote() ? remoteApi : localApi).createThread(...a),
    createPost: (...a) => (usingRemote() ? remoteApi : localApi).createPost(...a),
    _resetDemo: () => { localStorage.removeItem(LS_KEY); },
  };
})(window);

</script>
  <script>
/* ===========================================================
   ぼちゃんねる — app (router + rendering)
   =========================================================== */
(function () {
  "use strict";

  const $  = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const state = { view: "list", tab: "ikioi", threads: [], thread: null, search: "" };

  const root = $("#view");
  const elBack = $("#back");
  const elBrand = $("#brand");
  const elTitle = $("#hdrTitle");
  const elTabs = $("#tabs");
  const elBanner = $("#banner");
  const elSearch = $("#searchRow");

  // ---------------------------------------------------------
  // helpers
  // ---------------------------------------------------------
  function ageDays(ts){ return Math.max((Date.now()-ts)/86400000, 1/24); }
  function ikioi(t){ return Math.round(t.postCount / ageDays(t.createdAt) * 10) / 10; }
  function ikioiClass(v){ return v>=400 ? "fire" : v>=120 ? "hot" : ""; }
  function relTime(ts){
    const s=(Date.now()-ts)/1000;
    if(s<60) return "たった今";
    if(s<3600) return Math.floor(s/60)+"分前";
    if(s<86400) return Math.floor(s/3600)+"時間前";
    return Math.floor(s/86400)+"日前";
  }

  // render a post body: >>anchors, >quotes, urls
  function renderBody(text){
    const lines = String(text).split("\n");
    return lines.map(line => {
      let out = "";
      // tokenify by anchors / urls while escaping the rest
      const re = /(>>\d+(?:-\d+)?)|((?:https?:\/\/)[^\s]+)/g;
      let last = 0, m;
      const isQuote = /^\s*>(?!>)/.test(line);
      while ((m = re.exec(line))) {
        out += esc(line.slice(last, m.index));
        if (m[1]) {
          const n = m[1].replace(/^>>/, "");
          out += `<span class="anchor" data-anchor="${esc(n)}">${esc(m[1])}</span>`;
        } else if (m[2]) {
          out += `<a class="url" href="${esc(m[2])}" target="_blank" rel="noopener nofollow">${esc(m[2])}</a>`;
        }
        last = m.index + m[0].length;
      }
      out += esc(line.slice(last));
      return isQuote ? `<span class="gt">${out}</span>` : out;
    }).join("\n");
  }

  function parseName(name){
    // tripcode display: name#trip -> name + ◆hash (already-hashed names pass through)
    const i = name.indexOf("◆");
    if (i >= 0) return `${esc(name.slice(0,i))}<span class="trip">◆${esc(name.slice(i+1))}</span>`;
    return esc(name);
  }

  // count posts per uid in current thread for "many" highlight
  function uidCounts(posts){
    const c={}; posts.forEach(p=>c[p.uid]=(c[p.uid]||0)+1); return c;
  }

  // ---------------------------------------------------------
  // ROUTER
  // ---------------------------------------------------------
  function parseHash(){
    const h = location.hash.replace(/^#/, "");
    if (h.startsWith("/thread/")) return { name:"thread", id: decodeURIComponent(h.slice(8)) };
    if (h === "/new") return { name:"new" };
    return { name:"list" };
  }
  window.addEventListener("hashchange", route);

  async function route(){
    const r = parseHash();
    if (r.name === "thread") return showThread(r.id);
    if (r.name === "new") { showList(); openComposer({mode:"thread"}); return; }
    return showList();
  }

  // ---------------------------------------------------------
  // LIST VIEW
  // ---------------------------------------------------------
  async function showList(){
    state.view = "list";
    elBack.classList.remove("show");
    elBrand.style.display = "flex";
    elTitle.style.display = "none";
    elTabs.style.display = "flex";
    elBanner.style.display = "flex";
    $("#hdrSearch").style.display = "flex";
    window.scrollTo(0,0);

    root.innerHTML = `<div class="loading"><div class="spinner"></div>スレッドを読み込み中…</div>`;
    let threads;
    try { threads = await API.getThreads(); }
    catch(e){ root.innerHTML = errorBox(e); return; }
    state.threads = threads;
    paintBanner(threads);
    paintList();
  }

  function paintBanner(threads){
    const posts = threads.reduce((a,t)=>a+t.postCount,0);
    elBanner.innerHTML = `
      <div class="banner__icon">♪</div>
      <div class="banner__txt">
        <div class="banner__name">${esc(API.CONFIG.BOARD_NAME)}</div>
        <div class="banner__desc">ボカロP・リスナーが集う総合掲示板</div>
        <div class="banner__stats">
          <span>スレッド ${threads.length}</span>
          <span>書き込み ${posts}</span>
          ${API.isDemo() ? '<span style="color:#c8631a">● DEMOモード</span>' : '<span style="color:#1f8a4c">● LIVE</span>'}
        </div>
      </div>`;
  }

  function sortedThreads(){
    let ts = state.threads.slice();
    if (state.search){
      const q = state.search.toLowerCase();
      ts = ts.filter(t => t.title.toLowerCase().includes(q));
    }
    if (state.tab === "ikioi") ts.sort((a,b)=> ikioi(b)-ikioi(a));
    else if (state.tab === "new") ts.sort((a,b)=> b.createdAt - a.createdAt);
    else ts.sort((a,b)=> b.lastAt - a.lastAt); // recent activity
    return ts;
  }

  function paintTabs(){
    elTabs.innerHTML = [
      ["ikioi","勢い順"],["update","新着レス"],["new","新規スレ"],
    ].map(([k,label])=>`
      <button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${label}</button>
    `).join("");
  }

  function paintList(){
    paintTabs();
    const ts = sortedThreads();
    if (!ts.length){
      root.innerHTML = `<div class="empty"><div class="em">🎤</div>${state.search?"該当するスレッドがありません":"まだスレッドがありません。<br>最初のスレを立ててみよう！"}</div>` + footer();
      return;
    }
    const rows = ts.map((t,i)=>{
      const v = ikioi(t);
      const fresh = Date.now()-t.lastAt < 1000*60*60*3;
      return `
      <div class="thread" data-id="${esc(t.id)}">
        <div class="thread__rank">${i+1}</div>
        <div class="thread__body">
          <div class="thread__title">${esc(t.title)}</div>
          <div class="thread__meta">
            <span class="thread__count">💬 ${t.postCount}</span>
            <span class="momentum ${ikioiClass(v)}">勢い ${v}</span>
            <span>${relTime(t.lastAt)}</span>
            ${fresh?'<span class="thread__new">NEW</span>':""}
          </div>
        </div>
      </div>`;
    }).join("");
    root.innerHTML = `<div class="list">${rows}</div>` + footer();
  }

  // ---------------------------------------------------------
  // THREAD VIEW
  // ---------------------------------------------------------
  async function showThread(id){
    state.view = "thread";
    elBack.classList.add("show");
    elBrand.style.display = "none";
    elTitle.style.display = "block";
    elTabs.style.display = "none";
    elBanner.style.display = "none";
    elSearch.classList.remove("open");
    $("#hdrSearch").style.display = "none";
    window.scrollTo(0,0);

    root.innerHTML = `<div class="loading"><div class="spinner"></div>読み込み中…</div>`;
    let t;
    try { t = await API.getThread(id); }
    catch(e){ root.innerHTML = errorBox(e); elTitle.textContent="スレッド"; return; }
    state.thread = t;
    elTitle.textContent = t.title;

    const counts = uidCounts(t.posts);
    const postsHtml = t.posts.map(p => postHtml(p, counts)).join("");
    const created = new Date(t.createdAt);
    root.innerHTML = `
      <div class="threadhead">
        <div class="threadhead__title">${esc(t.title)}</div>
        <div class="threadhead__meta">
          <span>全 ${t.postCount} レス</span>
          <span>勢い ${ikioi(t)}</span>
          <span>${created.getFullYear()}/${String(created.getMonth()+1).padStart(2,"0")}/${String(created.getDate()).padStart(2,"0")} 開始</span>
        </div>
      </div>
      <div class="posts">${postsHtml}</div>` + footer();
  }

  function postHtml(p, counts){
    const isOp = p.num === 1;
    const sage = /sage/i.test(p.email||"");
    const n = counts[p.uid]||1;
    const idCls = n>=3 ? "many" : "";
    const idTxt = n>1 ? `ID:${esc(p.uid)} (${n})` : `ID:${esc(p.uid)}`;
    const nameDisp = sage
      ? parseName(p.name)
      : `<a href="mailto:" onclick="return false" style="color:inherit">${parseName(p.name)}</a>`;
    return `
      <div class="post ${p.abone?"abone":""}" id="p${p.num}" data-num="${p.num}">
        <div class="post__head">
          <span class="post__num ${isOp?"op":""}" data-reply="${p.num}">${p.num}</span>
          <span class="post__name">${nameDisp}</span>
          ${sage?'<span class="post__sage">sage</span>':""}
          <span class="post__date">${esc(p.date)}</span>
          <span class="post__id ${idCls}" data-uid="${esc(p.uid)}">${idTxt}</span>
        </div>
        <div class="post__body">${p.abone?"あぼ〜ん":renderBody(p.body)}</div>
        <div class="post__foot">
          <span class="post__reply" data-reply="${p.num}">↩ 返信</span>
        </div>
      </div>`;
  }

  // ---------------------------------------------------------
  // shared chrome
  // ---------------------------------------------------------
  function footer(){
    return `<div class="foot">
      ぼちゃんねる — Vocaloid BBS<br>
      ${API.isDemo()
        ? 'デモ表示中（ブラウザ内に保存）・ <a href="admin.html">管理画面</a>'
        : '<a href="admin.html">管理画面</a>'}
    </div>`;
  }
  function errorBox(e){
    return `<div class="empty"><div class="em">⚠️</div>${esc(e.message||"エラーが発生しました")}<br>
      <span style="font-size:12px;color:#93a1a3">時間をおいて再度お試しください</span></div>`;
  }

  // ---------------------------------------------------------
  // ANCHOR POPOVER
  // ---------------------------------------------------------
  let popEl = null;
  function showPopover(num, x, y){
    if (!state.thread) return;
    const p = state.thread.posts.find(q => q.num === Number(num));
    if (!p) return;
    hidePopover();
    popEl = document.createElement("div");
    popEl.className = "popover";
    const counts = uidCounts(state.thread.posts);
    popEl.innerHTML = postHtml(p, counts).replace('class="post ', 'class="pop-inner post ');
    document.body.appendChild(popEl);
    const r = popEl.getBoundingClientRect();
    let left = Math.min(x, window.innerWidth - r.width - 10);
    let top = y + 16;
    if (top + r.height > window.innerHeight - 8) top = Math.max(8, y - r.height - 16);
    popEl.style.left = Math.max(8,left) + "px";
    popEl.style.top = top + "px";
  }
  function hidePopover(){ if (popEl){ popEl.remove(); popEl=null; } }

  // ---------------------------------------------------------
  // COMPOSER (sheet)
  // ---------------------------------------------------------
  function openComposer(opts){
    const mode = opts.mode; // "thread" | "reply"
    const quote = opts.quote || "";
    const wrap = $("#sheetWrap");
    wrap.innerHTML = `
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet__grip"></div>
        <div class="sheet__title">${mode==="thread"?"🧵 新規スレッドを立てる":"✏️ レスを書き込む"}</div>
        <div class="errline" id="cErr"></div>
        ${mode==="thread" ? `
          <div class="field">
            <label>スレッドタイトル</label>
            <input id="fTitle" maxlength="80" placeholder="例）作業用に最適なボカロ曲を語るスレ" autocomplete="off">
          </div>`:""}
        <div class="field">
          <div class="row">
            <div>
              <label>名前</label>
              <input id="fName" maxlength="40" placeholder="名無しのボカロP" autocomplete="off">
            </div>
            <div>
              <label>メール</label>
              <input id="fMail" maxlength="40" placeholder="sage で下げ" autocomplete="off">
            </div>
          </div>
        </div>
        <div class="field">
          <label>本文</label>
          <textarea id="fBody" maxlength="2000" placeholder="${mode==="thread"?"スレッドの最初の書き込みを入力…":"本文を入力…  >>番号 で安価できます"}">${esc(quote)}</textarea>
          <div class="hint"><span id="cCount">0</span>/2000　・　&gt;&gt;番号 で安価、行頭 &gt; で引用</div>
        </div>
        <div class="sheet__actions">
          <button class="btn ghost" data-close>キャンセル</button>
          <button class="btn primary" id="cSubmit">${mode==="thread"?"スレを立てる":"書き込む"}</button>
        </div>
      </div>`;
    wrap.classList.add("open");
    const body = $("#fBody");
    const count = $("#cCount");
    const upd = ()=> count.textContent = body.value.length;
    body.addEventListener("input", upd); upd();
    setTimeout(()=> (mode==="thread"?$("#fTitle"):body).focus(), 60);

    wrap.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click", closeComposer));
    $("#cSubmit").addEventListener("click", ()=> submitComposer(mode));
  }
  function closeComposer(){ const w=$("#sheetWrap"); w.classList.remove("open"); w.innerHTML=""; if(location.hash==="#/new") history.replaceState(null,"",location.pathname); }

  async function submitComposer(mode){
    const err = $("#cErr");
    const show = (m)=>{ err.textContent=m; err.classList.add("show"); };
    err.classList.remove("show");
    const name = $("#fName").value, mail = $("#fMail").value, bodyV = $("#fBody").value.trim();
    if (!bodyV){ show("本文を入力してください"); return; }
    const btn = $("#cSubmit"); btn.disabled = true; btn.textContent = "送信中…";
    try{
      if (mode==="thread"){
        const title = $("#fTitle").value.trim();
        if (!title){ show("タイトルを入力してください"); btn.disabled=false; btn.textContent="スレを立てる"; return; }
        const r = await API.createThread({ title, name, email:mail, body:bodyV });
        closeComposer(); toast("スレッドを立てました🎉");
        location.hash = "#/thread/" + encodeURIComponent(r.id);
      } else {
        const r = await API.createPost({ threadId: state.thread.id, name, email:mail, body:bodyV });
        closeComposer(); toast("書き込みました");
        await showThread(state.thread.id);
        const el = $("#p"+r.num); if (el){ el.classList.add("flash"); el.scrollIntoView({block:"center"}); }
      }
    }catch(e){
      btn.disabled=false; btn.textContent = mode==="thread"?"スレを立てる":"書き込む";
      let m = e.message || "送信に失敗しました";
      if (e.status===429 && e.retryAfter) m += `（あと約${e.retryAfter}秒）`;
      show(m);
    }
  }

  // ---------------------------------------------------------
  // TOAST
  // ---------------------------------------------------------
  let toastTimer;
  function toast(msg, isErr){
    let t = $("#toast");
    if (!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle("err", !!isErr);
    requestAnimationFrame(()=> t.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove("show"), 2400);
  }

  // ---------------------------------------------------------
  // GLOBAL EVENTS
  // ---------------------------------------------------------
  document.addEventListener("click", (e)=>{
    const thread = e.target.closest(".thread");
    if (thread){ location.hash = "#/thread/" + encodeURIComponent(thread.dataset.id); return; }

    const tab = e.target.closest(".tab");
    if (tab){ state.tab = tab.dataset.tab; paintList(); return; }

    const anchor = e.target.closest(".anchor");
    if (anchor){
      const n = anchor.dataset.anchor.split("-")[0];
      const el = $("#p"+n);
      if (el){ el.scrollIntoView({block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
      else showPopover(n, e.clientX, e.clientY);
      return;
    }

    const reply = e.target.closest("[data-reply]");
    if (reply && state.view==="thread"){
      openComposer({ mode:"reply", quote: ">>"+reply.dataset.reply+"\n" });
      return;
    }
    if (!e.target.closest(".popover")) hidePopover();
  });

  // hover popover on desktop
  document.addEventListener("mouseover", (e)=>{
    const a = e.target.closest(".anchor");
    if (a && state.view==="thread"){
      const n = a.dataset.anchor.split("-")[0];
      if ($("#p"+n)) return; // on-page, click scrolls
      showPopover(n, e.clientX, e.clientY);
    }
  });
  document.addEventListener("mouseout",(e)=>{ if (e.target.closest(".anchor")) setTimeout(()=>{ if(!popEl?.matches(":hover")) hidePopover(); }, 60); });

  // header buttons
  elBack.addEventListener("click", ()=>{ if (history.length>1) history.back(); else location.hash=""; });
  elBrand.addEventListener("click", ()=>{ location.hash=""; });
  $("#hdrSearch").addEventListener("click", ()=>{
    elSearch.classList.toggle("open");
    if (elSearch.classList.contains("open")) $("#searchInput").focus();
  });
  $("#searchInput").addEventListener("input", (e)=>{ state.search = e.target.value.trim(); if(state.view==="list") paintList(); });

  // composer FABs
  $("#fabNew").addEventListener("click", ()=>{
    if (state.view==="thread") openComposer({mode:"reply"});
    else openComposer({mode:"thread"});
  });
  $("#fabThread").addEventListener("click", ()=> openComposer({mode:"thread"}));

  // keep FAB label in sync per view via a small observer-ish patch
  const fabNew = $("#fabNew"), fabThread = $("#fabThread");
  function syncFab(){
    if (state.view==="thread"){ fabNew.innerHTML="✏️ 書き込む"; fabThread.style.display="flex"; fabThread.title="新規スレッド"; }
    else { fabNew.innerHTML="🧵 新規スレッド"; fabThread.style.display="none"; }
  }
  const _showThread = showThread, _showList = showList;
  showThread = async function(...a){ await _showThread.apply(null,a); syncFab(); };
  showList   = async function(...a){ await _showList.apply(null,a);   syncFab(); };

  window.addEventListener("scroll", hidePopover, { passive:true });

  // boot
  paintTabs();
  route();
})();

</script>
</body>
</html>
